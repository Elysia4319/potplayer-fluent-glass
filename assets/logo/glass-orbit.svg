<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>Glass Orbit — media player logo</title>
  <desc>A translucent cyan-violet rounded glass square with a floating glass play button, delicate light particles and iridescent star glints.</desc>
  <defs>
    <linearGradient id="glass" x1="54" y1="42" x2="211" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6CF6ED" stop-opacity=".35"/>
      <stop offset=".44" stop-color="#8DAEF8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C77DF4" stop-opacity=".40"/>
    </linearGradient>
    <linearGradient id="rim" x1="51" y1="45" x2="207" y2="207" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4FFFF" stop-opacity=".96"/>
      <stop offset=".3" stop-color="#7DEBEF" stop-opacity=".55"/>
      <stop offset=".58" stop-color="#A8B5FF" stop-opacity=".17"/>
      <stop offset="1" stop-color="#DEAEFF" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="76" y1="51" x2="143" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".31"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="102" y1="91" x2="162" y2="171" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".92"/>
      <stop offset=".47" stop-color="#D5FFFF" stop-opacity=".57"/>
      <stop offset="1" stop-color="#C3B3FF" stop-opacity=".40"/>
    </linearGradient>
    <linearGradient id="orbit" x1="29" y1="82" x2="225" y2="189" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EEFE6" stop-opacity=".70"/>
      <stop offset=".48" stop-color="#AAB8FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#D6A3FF" stop-opacity=".73"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop stop-color="white" stop-opacity=".82"/>
      <stop offset=".2" stop-color="#BCF8FF" stop-opacity=".40"/>
      <stop offset="1" stop-color="#97B4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop stop-color="#53F6E6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#53F6E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop stop-color="#B375FA" stop-opacity=".29"/>
      <stop offset="1" stop-color="#B375FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="float" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#11172F" flood-opacity=".40"/>
    </filter>
    <clipPath id="clip"><rect x="48" y="48" width="160" height="160" rx="40"/></clipPath>
  </defs>
  <!-- Rear orbit fades behind the glass. -->
  <ellipse cx="128" cy="130" rx="116" ry="62" transform="rotate(-29 128 130)" stroke="url(#orbit)" stroke-width="1.15" opacity=".55"/>
  <rect x="49" y="54" width="160" height="160" rx="40" fill="#060D1A" fill-opacity=".15"/>
  <rect x="48" y="48" width="160" height="160" rx="40" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.6"/>
  <g clip-path="url(#clip)">
    <ellipse cx="66" cy="65" rx="113" ry="92" fill="url(#cyan)"/>
    <ellipse cx="203" cy="208" rx="107" ry="99" fill="url(#violet)"/>
    <path d="M48 90V85C48 64.6 64.6 48 85 48H171C189 48 201 58 206 72C160 67 121 91 48 111Z" fill="url(#sheen)"/>
    <rect x="54" y="54" width="148" height="148" rx="35" stroke="white" stroke-opacity=".10"/>
  </g>
  <path d="M62 91V86C62 71.6 73.6 60 88 60H126" stroke="white" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M169 198H174C187.3 198 198 187.3 198 174V160" stroke="white" stroke-opacity=".31" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Refracted lower lip of the floating play prism. -->
  <path d="M108 98C104.5 96 101 98.5 101 102.5V164.5C101 168.5 104.8 171 108.2 169L161.5 137.5C165 135.5 165 131.1 161.5 129Z" transform="translate(0 4)" fill="#9CA3FB" fill-opacity=".23"/>
  <path d="M108 94C104.5 92 101 94.5 101 98.5V160.5C101 164.5 104.8 167 108.2 165L161.5 133.5C165 131.5 165 127.1 161.5 125Z" fill="url(#play)" stroke="white" stroke-opacity=".68" stroke-width="1.5" stroke-linejoin="round" filter="url(#float)"/>
  <path d="M107 101V151M112 100L151 123" stroke="white" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Light particles: bloom is translucent vector gradient, never an icon. -->
  <g id="light-particles">
    <circle cx="58" cy="67" r="15" fill="url(#spark)"/>
    <circle cx="207" cy="68" r="13" fill="url(#spark)" opacity=".80"/>
    <circle cx="206" cy="193" r="17" fill="url(#spark)" opacity=".76"/>
    <path d="M58 59L59.5 65.5L66 67L59.5 68.5L58 75L56.5 68.5L50 67L56.5 65.5Z" fill="white" fill-opacity=".88"/>
    <path d="M207 63L208 67L212 68L208 69L207 73L206 69L202 68L206 67Z" fill="#E2F5FF" fill-opacity=".85"/>
    <path d="M206 186L207.4 191.6L213 193L207.4 194.4L206 200L204.6 194.4L199 193L204.6 191.6Z" fill="#F2E5FF" fill-opacity=".90"/>
    <circle cx="42" cy="105" r="1.6" fill="#DCFFFF" fill-opacity=".85"/>
    <circle cx="86" cy="37" r="1.4" fill="#B9FDF7" fill-opacity=".72"/>
    <circle cx="216" cy="148" r="1.5" fill="#DDD0FF" fill-opacity=".80"/>
    <circle cx="175" cy="220" r="1.8" fill="#CBB6FF" fill-opacity=".72"/>
    <circle cx="42" cy="196" r="1.2" fill="#BAF4FD" fill-opacity=".65"/>
    <circle cx="179" cy="48" r="1.1" fill="white" fill-opacity=".60"/>
  </g>
  <circle cx="74" cy="216" r="2.3" fill="#9CE9F6" fill-opacity=".80"/>
  <circle cx="31" cy="164" r="1.7" fill="#A1F1EC" fill-opacity=".57"/>
  <circle cx="160" cy="30" r="2" fill="#BECEFF" fill-opacity=".70"/>
  <circle cx="231" cy="124" r="1.6" fill="#D2B1FF" fill-opacity=".63"/>
</svg>
